<!DOCTYPE html>
<!-- Knoiren Browser, the launcher. The browser itself is v2.html; this page
     fetches it and writes it into a blank window, the same thing open.svg does
     for a host that will not run .html at all. The UI comes from
     raw.githubusercontent, so a CDN holding a week-old copy of v2.html cannot
     hand out a stale browser. There is no 404.html: the worker is installed
     before any proxied request is made, so nothing has to be caught and
     retried. -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>404 not found</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        button {
            width: 100%;
            height: 100%;
            font-size: 16pt;
            font-family: 'Comic Sans MS', sans-serif;
        }
    </style>
</head>

<body>
    <button onclick="launch()">click here</button>

    <script>
        // The copy next to this file is the fallback, for a network that blocks
        // raw.githubusercontent.
        var RAW = 'https://raw.githubusercontent.com/ltorl/knoiren-browser/main/v2.html';

        function ui() {
            return fetch(RAW, { cache: 'no-store' }).then(function (r) {
                if (!r.ok) throw new Error('raw.githubusercontent.com answered ' + r.status);
                return r.text();
            }).catch(function () {
                return fetch('./v2.html').then(function (r) {
                    if (!r.ok) throw new Error('./v2.html answered ' + r.status);
                    return r.text();
                });
            });
        }

        function launch() {
            // The window is opened first, while the click is still the reason
            // anything is happening; a popup asked for after the fetch is blocked.
            var n = window.open('about:blank', '_blank');
            if (!n) return;
            ui().then(function (text) {
                var d = n.document;
                d.open();
                d.write(text);
                d.close();

                window.close();
            }, function (err) {
                n.document.body.textContent = 'Could not load the browser: ' + ((err && err.message) || err);
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            document.querySelector('button').click();
        });
    </script>
</body>

</html>
