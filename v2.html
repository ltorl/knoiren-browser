<!DOCTYPE html>
<!-- Knoiren Browser, single-file static build: the UI from index.js and the
     Peekaboom proxy it browses through, in one page. The proxy is sw.js, this
     file's own service worker, installed on load; there is no other proxy to
     point it at, and Settings only reports it. Deploy as v2.html next to sw.js;
     index.html and open.svg are the launchers that write this file into a blank
     window, so nothing here may depend on the address bar. -->

    <style>
        :root {
            --bg: #282828;
            --fg: #3c3c3c;
            --text: #e8e8e8;
            --muted: #9aa0a6;
            --trash-icon: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            /* clip, unlike hidden, can't be scrolled by scripts: a page's
               scrollIntoView() would otherwise shift the whole UI sideways. */
            overflow: clip;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            user-select: none;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        #tabbar {
            display: flex;
            align-items: flex-end;
            height: 40px;
            background: var(--bg);
            padding: 0 6px 0 40px;
            gap: 0;
            flex: 0 0 auto;
            overflow: hidden;
            max-height: 40px;
            transition: max-height 0.25s ease;
        }

        #app.chrome-hidden #tabbar {
            max-height: 0;
        }


        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.15s ease, transform 0.25s ease;
            flex: 0 0 auto;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.10);
        }

        .icon-btn img {
            pointer-events: none;
            -webkit-user-drag: none;
        }

        #collapse-btn {
            position: absolute;
            top: 5px;
            left: 6px;
            width: 30px;
            height: 30px;
            z-index: 100;
            transform: translateY(3px);
        }

        #collapse-btn img {
            width: 18px;
            height: 18px;
            transition: transform 0.25s ease;
            filter: invert(1);
        }

        #collapse-btn.collapsed img {
            transform: rotate(180deg);
        }

        #app.chrome-hidden #collapse-btn {
            background: rgba(40, 40, 40, 0.85);
        }

        #app.chrome-hidden #collapse-btn:hover {
            background: rgba(60, 60, 60, 0.95);
        }

        #tabs {
            display: flex;
            align-items: flex-end;
            flex: 0 1 auto;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            padding: 0 8px;
            isolation: isolate;
        }

        #tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 100px;
            width: 232px;
            height: 32px;
            padding: 0 10px;
            background: var(--bg);
            color: var(--muted);
            cursor: default;
            position: relative;
            border-radius: 10px 10px 0 0;
            flex: 0 1 232px;
            font-size: 13px;
            transition: background 0.12s ease;
        }

        .tab:not(.active):hover {
            isolation: isolate;
        }

        .tab .favicon,
        .tab .tab-title,
        .tab .tab-close {
            transition: transform 0.2s ease;
        }

        .tab:not(.active) .favicon,
        .tab:not(.active) .tab-title,
        .tab:not(.active) .tab-close {
            transform: translateY(-3px);
        }

        .tab:not(.active):hover::before {
            content: '';
            position: absolute;
            left: 2px;
            right: 2px;
            top: 0;
            bottom: 6px;
            background: #474747;
            border-radius: 8px;
            pointer-events: none;
            z-index: -1;
        }

        .tab.dragging {
            z-index: 5;
            cursor: grabbing;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
            transition: none;
        }

        .tab.pinned {
            width: 36px;
            min-width: 36px;
            flex: 0 0 36px;
        }

        .tab.label-anim .tab-title {
            text-overflow: clip;
        }

        .tab.active {
            background: var(--fg);
            color: var(--text);
            z-index: 1;
        }

        .tab.active::before,
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 8px;
            height: 8px;
            pointer-events: none;
        }

        .tab.active::before {
            left: -8px;
            background: radial-gradient(circle at top left, transparent 8px, var(--fg) 8px);
        }

        .tab.active::after {
            right: -8px;
            background: radial-gradient(circle at top right, transparent 8px, var(--fg) 8px);
        }

        .tab .favicon {
            width: 16px;
            height: 16px;
            flex: 0 0 16px;
            border-radius: 3px;
            object-fit: contain;
            -webkit-user-drag: none;
        }

        .tab.closing .favicon {
            flex: 0 1 16px;
            min-width: 0;
        }

        .tab .tab-title {
            flex: 1 1 auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tab .tab-close {
            flex: 0 0 18px;
            width: 18px;
            height: 18px;
            line-height: 16px;
            text-align: center;
            border-radius: 50%;
            font-size: 16px;
            color: var(--muted);
            opacity: 1;
            transition: background 0.12s ease, transform 0.2s ease;
        }

        .tab .tab-audio {
            display: none;
            flex: 0 0 20px;
            width: 20px;
            height: 20px;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: var(--muted);
            transition: background 0.12s ease, transform 0.2s ease;
        }

        .tab.has-audio .tab-audio {
            display: flex;
        }

        .tab .tab-audio[data-sound="muted"] {
            color: #f28b82;
        }

        .tab .tab-audio:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
        }

        .tab:not(.active) .tab-audio {
            transform: translateY(-3px);
        }

        .tab .tab-close:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
        }

        .tab-sep {
            width: 1px;
            height: 18px;
            background: var(--fg);
            flex: 0 0 1px;
            align-self: center;
            margin: 0 2px;
        }

        .tab-sep.hidden {
            background: transparent;
        }

        #newtab-btn {
            width: 28px;
            height: 28px;
            margin: 0 4px 4px -4px;
            font-size: 20px;
            color: var(--text);
            line-height: 1;
        }

        #toolbar {
            background: var(--fg);
            flex: 0 0 auto;
            overflow: hidden;
            transition: height 0.25s ease;
        }

        #navbar {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 48px;
            padding: 0 10px;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
        }

        .nav-btn img {
            width: 22px;
            height: 22px;
            filter: invert(0);
            -webkit-user-drag: none;
        }

        .nav-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        #btn-back img {
            transform: rotate(180deg);
        }

        #urlbar {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            height: 32px;
            background: var(--bg);
            border-radius: 16px;
            padding: 0 6px;
            margin: 0 6px;
            border: 1px solid transparent;
            transition: border-color 0.15s ease;
        }

        #urlbar:focus-within {
            border-color: rgba(120, 170, 255, 0.6);
        }

        #url-input {
            flex: 1 1 auto;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 14px;
            user-select: text;
        }

        #url-input::placeholder {
            color: var(--muted);
        }

        #url-suggest {
            position: fixed;
            z-index: 50;
            background: var(--bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: none;
        }

        #url-suggest.open {
            display: block;
        }

        #url-suggest .suggest-item {
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #url-suggest .suggest-item.active {
            background: rgba(255, 255, 255, 0.10);
        }

        #url-suggest .suggest-item.open-link {
            color: #cfe0ff;
            background: rgba(80, 130, 255, 0.18);
        }

        #url-suggest .suggest-item.open-link.active {
            background: rgba(80, 130, 255, 0.32);
        }

        #site-btn {
            flex: 0 0 auto;
            width: 24px;
            height: 24px;
            padding: 0;
            margin-left: -3px;
            margin-right: 6px;
            border-radius: 50%;
            background: #3c3c3c;
        }

        #site-btn:hover,
        #site-btn.active {
            background: #555554;
        }

        #site-btn img {
            width: 20px;
            height: 20px;
            -webkit-user-drag: none;
        }

        #site-panel {
            position: fixed;
            z-index: 50;
            min-width: 250px;
            background: var(--fg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            color: var(--text);
            display: none;
        }

        #site-panel.open {
            display: block;
        }

        #site-panel .site-panel-head {
            font-size: 13px;
            font-weight: 600;
            word-break: break-all;
            margin-bottom: 10px;
        }

        #site-panel .site-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 13px;
            padding: 4px 0;
        }

        #site-panel .site-status {
            color: var(--muted);
        }

        #site-panel .site-reset {
            margin-top: 12px;
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.10);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
        }

        #site-panel .site-reset:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.18);
        }

        #site-panel .site-reset:disabled {
            opacity: 0.45;
            cursor: default;
        }

        #star-btn {
            width: 24px;
            height: 24px;
            flex: 0 0 24px;
        }

        #star-btn img {
            width: 18px;
            height: 18px;
            -webkit-user-drag: none;
        }

        #games-btn,
        #settings-btn {
            margin-left: 2px;
        }

        #games-btn img,
        #settings-btn img {
            width: 22px;
            height: 22px;
            filter: none;
            -webkit-user-drag: none;
        }

        #games-btn.active,
        #settings-btn.active {
            background: rgba(120, 170, 255, 0.18);
        }

        .settingspage {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            background: linear-gradient(135deg, #0b0c10 0%, #1f2833 100%);
            color: var(--text);
            padding: 40px 20px 60px;
        }

        .settingspage .set-inner {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .settingspage .set-title {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .set-group {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--muted);
            margin: 18px 4px 2px;
        }

        .set-option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text);
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .set-option:hover {
            background: rgba(255, 255, 255, 0.11);
        }

        .set-option.selected {
            border-color: #45a29e;
            background: rgba(69, 162, 158, 0.16);
        }

        .set-radio {
            flex: 0 0 14px;
            width: 14px;
            height: 14px;
            margin-top: 3px;
            border-radius: 50%;
            border: 2px solid var(--muted);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .set-option.selected .set-radio {
            border-color: #66fcf1;
            box-shadow: inset 0 0 0 3px #66fcf1;
        }

        .set-option .set-name {
            font-size: 0.92rem;
            font-weight: 600;
        }

        .set-option .set-desc {
            font-size: 0.76rem;
            line-height: 1.45;
            color: var(--muted);
            margin-top: 3px;
        }

        .set-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 6px;
            font-size: 0.76rem;
            color: var(--muted);
        }

        .set-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
            flex: 0 0 8px;
        }

        .set-dot.ready {
            background: #66fcf1;
        }

        .set-dot.failed {
            background: #e06c6c;
        }

        .set-field {
            display: flex;
            gap: 8px;
        }

        .set-input {
            flex: 1 1 auto;
            min-width: 0;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            font: inherit;
            font-size: 0.88rem;
        }

        .set-input:focus {
            outline: none;
            border-color: #45a29e;
            background: rgba(255, 255, 255, 0.1);
        }

        .set-btn {
            flex: 0 0 auto;
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid #45a29e;
            background: rgba(69, 162, 158, 0.2);
            color: var(--text);
            font: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .set-btn:hover {
            background: rgba(69, 162, 158, 0.35);
        }

        .set-note.set-error,
        .set-note.set-warn {
            color: #e8a06c;
        }

        .set-note {
            padding: 0 6px;
            font-size: 0.72rem;
            line-height: 1.5;
            color: var(--muted);
        }

        .set-site {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 10px 10px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text);
            font-size: 0.88rem;
        }

        .set-site .set-site-name {
            flex: 1 1 auto;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .set-site .set-del {
            flex: 0 0 auto;
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            border: none;
            background: transparent;
            padding: 0;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        /* Masked so the glyph takes its colour from the button state. */
        .set-site .set-del::before {
            content: '';
            width: 17px;
            height: 17px;
            background: var(--muted);
            transition: background 0.15s ease;
            -webkit-mask: var(--trash-icon) center / contain no-repeat;
            mask: var(--trash-icon) center / contain no-repeat;
        }

        .set-site .set-del:hover {
            background: rgba(224, 108, 108, 0.18);
        }

        .set-site .set-del:hover::before {
            background: #ffb4b4;
        }

        .set-empty {
            padding: 14px;
            border-radius: 10px;
            border: 1px dashed rgba(255, 255, 255, 0.14);
            font-size: 0.82rem;
            color: var(--muted);
            text-align: center;
        }

        #bookmarksbar {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 34px;
            padding: 0 8px;
            background: var(--fg);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            white-space: nowrap;
        }

        #bookmarksbar::-webkit-scrollbar {
            display: none;
        }

        .bm {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 26px;
            padding: 0 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            color: var(--text);
            max-width: 180px;
            flex: 0 0 auto;
            transition: background 0.12s ease;
        }

        .bm:hover {
            background: rgba(255, 255, 255, 0.10);
        }

        .bm img {

    <script>
        // ---------------------------------------------------------- bootstrap
        // The UI browses through sw.js, a port of the proxy to a service
        // worker, so the page installs it before anything loads. Nothing here
        // may read the address bar: open.svg writes this file into an
        // about:blank window, where location says nothing about where the page
        // came from while its base URL still does.
        (function () {
            // libcurl.js dials its sockets through a Wisp relay. sw.js has the
            // same default and remembers whatever it was last given, but the
            // page hands its own copy over on every start, so Settings decides.
            var WISP_DEFAULT = 'wss://anura.pro/';
            var WKEY = '__px_wisp';
            var WISP = WISP_DEFAULT;
            try { WISP = localStorage.getItem(WKEY) || WISP_DEFAULT; } catch (e) { }
            var BKEY = '__px_base';
            var sw = navigator.serviceWorker;

            // Where this file really came from: its base URL, which a blank
            // window inherits from whatever wrote into it.
            var HERE = (function () {
                var tries = [document.baseURI, location.href];
                for (var i = 0; i < tries.length; i++) {
                    try {
                        var u = new URL(tries[i]);
                        if (/^https?:$/.test(u.protocol)) return u;
                    } catch (e) { }
                }
                // Opened as a file, where there is no proxy to be had.
                return null;
            })();
            // document.open() hands the new document the URL of whatever wrote
            // into it, so a page written into a blank window looks like open.svg
            // and only its navigation entry still says where it started.
            var entry = performance.getEntriesByType
                && performance.getEntriesByType('navigation')[0];
            var written = !/^https?:$/.test(location.protocol)
                || !!(entry && entry.name === 'about:blank');
            var path = HERE ? HERE.pathname : '/';

            // The directory this file was served from. A service worker may
            // only claim the directory it came from, so a project page under
            // /name/ proxies under /name/__px/ and the base has to be worked
            // out at runtime.
            var at = path.indexOf('/__px/');
            var BASE, home;
            if (at >= 0) {
                // The host served this file in place of a proxied URL.
                BASE = path.slice(0, at + 1);
                home = false;
            } else if (written || /(?:^|\/)(?:index|v2)\.html$/.test(path) || /\/$/.test(path)) {
                BASE = path.replace(/[^/]*$/, '');
                home = true;
            } else {
                // A path the worker is meant to answer but hid from the address
                // bar: the base it last registered under is all that is left.
                try { BASE = localStorage.getItem(BKEY) || '/'; } catch (e) { BASE = '/'; }
                home = false;
            }
            var ORIGIN = HERE ? HERE.origin : location.origin;

            var PX = window.__px = {
                here: HERE,
                origin: ORIGIN,
                base: BASE,
                prefix: BASE + '__px/',
                // The proxy's address: this origin plus the deployment's
                // directory, with no trailing slash, as the UI wants it.
                proxy: ORIGIN + BASE.replace(/\/+$/, ''),
                home: home,
                // Written into a blank window: same origin and base, but no
                // service worker container of its own -- see PX.ready.
                written: written,
                home: home,
                // The Wisp relay, and the way Settings points it elsewhere.
                wisp: WISP,
                wispDefault: WISP_DEFAULT,
                setWisp: setWisp,
                ready: null
            };
            if (home) { try { localStorage.setItem(BKEY, BASE); } catch (e) { } }

            // The card only ever says the proxy is coming up, or why it did not.
            function card(kind, title, detail) {
                document.getElementById('px-boot-kind').textContent = kind;
                document.getElementById('px-boot-title').textContent = title;
                document.getElementById('px-boot-detail').textContent = detail || '';
                document.getElementById('px-boot').classList.add('open');
            }

            // Wait for a registration to have a worker that can answer frames.
            function active(reg) {
                return new Promise(function (done, fail) {
                    var tick = function () {
                        var w = reg.installing || reg.waiting || reg.active;
                        if (reg.active) return done(reg);
                        if (w) return w.addEventListener('statechange', tick, { once: true });
                        fail(new Error('the worker went away while installing'));
                    };
                    tick();
                });
            }

            // Hand the worker the relay and ask whether it came up.
            function ask(worker, msg) {
                return new Promise(function (done) {
                    var t = setTimeout(function () { done(null); }, 8000);
                    var on = function (e) {
                        if (!e.data || e.data.__px !== 'config') return;
                        clearTimeout(t);
                        sw.removeEventListener('message', on);
                        done(e.data);
                    };

                    try { worker.postMessage(msg); } catch (e) { clearTimeout(t); done(null); }
                });

            // document that was written into a blank window and so has no
            // usable container of its own. open.svg wrote this page, so it is
            // there, and a host that serves .html as text/plain still runs it.
            function install(wisp) {
                return new Promise(function (resolve) {
                    var frame = document.createElement('iframe');
                    frame.setAttribute('aria-hidden', 'true');
                    frame.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;border:0;visibility:hidden';
                    var done = false;
                    function finish(r) {
                        if (done) return;
                        done = true;
                        clearTimeout(timer);
                        window.removeEventListener('message', on);
                        if (frame.parentNode) frame.parentNode.removeChild(frame);
                        resolve(r);
                    }
                    function on(e) {
                        if (e.source !== frame.contentWindow) return;
                        if (!e.data || e.data.__px !== 'registered') return;
                        finish(e.data.ok ? { ok: true } : { ok: false, error: e.data.error || '' });
                    }

                        finish({ ok: false, error: 'No answer from ' + BASE + 'open.svg, which installs ' + BASE + 'sw.js.' });
                    }, 12000);
                    window.addEventListener('message', on);
                    frame.src = BASE + 'open.svg?px=register'
                        + (wisp ? '&wisp=' + encodeURIComponent(wisp) : '');
                    (document.body || document.documentElement).appendChild(frame);
                });
            }

            // Hand the worker a relay once it is already running, for Settings.
            // A written document may not touch its own container, so the message
            // goes the way the registration went, through a frame of open.svg.
            function setWisp(wisp) {
                WISP = wisp;
                PX.wisp = wisp;
                try {
                    if (wisp === WISP_DEFAULT) localStorage.removeItem(WKEY);
                    else localStorage.setItem(WKEY, wisp);
                } catch (e) { }
                if (!sw || !HERE) {
                    return Promise.resolve({ ok: false, error: 'There is no proxy here to tell.' });
                }
                if (written) return install(wisp);
                return sw.getRegistration(BASE).then(function (reg) {
                    var worker = sw.controller || (reg && reg.active);
                    if (!worker) throw new Error('the worker is not running');
                    return ask(worker, { __px: 'config', wisp: wisp });
                }).then(function (reply) {
                    // No reply means the page is not controlled, which says
                    // nothing about the worker; a reply that says so does.
                    if (reply && !reply.ok) {
                        return { ok: false, error: 'The worker is running but could not load libcurl.js.' };
                    }
                    return { ok: true };
                }).catch(function (err) {
                    return { ok: false, error: 'Could not reach ' + BASE + 'sw.js: ' + ((err && err.message) || err) };
                });
            }

            PX.ready = (function () {
                if (!sw) return Promise.resolve({ ok: false, error: 'This browser has no service workers.' });
                if (!HERE) {
                    return Promise.resolve({ ok: false, error: 'Opened as a file, where there is no origin for a worker to claim.' });
                }
                if (!self.isSecureContext) {
                    return Promise.resolve({ ok: false, error: 'A service worker needs https, or localhost.' });
                }
                if (written) {
                    // A written document may not touch its service worker
                    // container at all -- every call throws InvalidStateError.
                    // A frame of it at a real URL may, so open.svg installs the
                    // worker, which then claims the proxied frames by scope.
                    // Nothing else can install it: there is no copy of this
                    // file under the host's 404 page to catch a proxied request
                    // and retry, so the worker has to be there before any frame.
                    return install(WISP);
                }
                return sw.register(BASE + 'sw.js', { scope: BASE }).then(active).then(function (reg) {
                    return ask(sw.controller || reg.active, { __px: 'config', wisp: WISP });
                }).then(function (reply) {
                    // No reply means the page is not controlled, which the
                    // frames do not need; a reply that says so does not.
                    if (reply && !reply.ok) {
                        return { ok: false, error: 'The worker is running but could not load libcurl.js.' };
                    }
                    return { ok: true };
                }).catch(function (err) {
                    return { ok: false, error: 'Could not start ' + BASE + 'sw.js: ' + ((err && err.message) || err) };
                });
            })();

            // ------------------------------------------------ not the home page
            // A static host serves this file for unknown paths, so a proxied URL
            // lands here whenever no worker is controlling the page yet: install
            // one, then reload so the worker answers the request instead. The UI
            // sits this out -- see the end of the module below.
            if (!home) {
                card('Peekaboom', 'Starting the proxy…', location.href);
                PX.ready.then(function (r) {
                    if (r.ok) location.reload();
                    else card('Error', 'Could not start the proxy', r.error + '\n' + location.href);
                });
            }
        })();
    </script>
